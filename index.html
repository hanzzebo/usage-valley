<title>Token Valley</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: full-bleed 16-bit scene on canvas; floating HUD top-left; demo controls bottom */
  :root {
    --ink: #fff7e8;
    --shadow: #1a0f24;
    --warn: #ffd23f;
    --crit: #ff4f6d;
    --ok: #7be06a;
    --px: "Press Start 2P", ui-monospace, monospace;
    color-scheme: dark
  }

  html,
  body {
    height: 100%
  }

  body {
    background: #1a0f24;
    color: var(--ink);
    font-family: var(--px);
    overflow: hidden
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    display: block;
    object-fit: cover
  }

  .hud {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 16px;
    right: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px 22px;
    font-size: 10px;
    line-height: 1.7;
    text-shadow: 2px 2px 0 var(--shadow);
    pointer-events: none
  }

  .hud b {
    font-weight: 400;
    color: var(--warn)
  }

  .hp {
    display: inline-flex;
    gap: 2px;
    vertical-align: middle;
    margin-left: 6px
  }

  .hp i {
    width: 7px;
    height: 10px;
    background: rgba(26, 15, 36, .6);
    box-shadow: 1px 1px 0 var(--shadow)
  }

  .hp i.on {
    background: var(--c)
  }

  .ctl {
    position: fixed;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    left: 16px;
    right: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    font-size: 8px;
    text-shadow: 2px 2px 0 var(--shadow)
  }

  .ctl button {
    font-family: var(--px);
    font-size: 8px;
    color: var(--ink);
    background: rgba(26, 15, 36, .6);
    border: 2px solid var(--ink);
    padding: 6px 7px;
    cursor: pointer
  }

  .ctl button[aria-pressed=true] {
    background: var(--ink);
    color: var(--shadow)
  }

  .ctl button:focus-visible,
  .ctl input:focus-visible {
    outline: 2px dashed var(--warn);
    outline-offset: 2px
  }

  .ctl label {
    display: flex;
    align-items: center;
    gap: 8px
  }

  .ctl input {
    accent-color: var(--warn);
    width: 130px
  }

  .msg {
    position: fixed;
    left: 50%;
    top: 36%;
    transform: translateX(-50%);
    font-size: 12px;
    text-align: center;
    line-height: 2;
    text-shadow: 3px 3px 0 var(--shadow);
    color: var(--crit);
    pointer-events: none;
    width: 90%;
    animation: bl 1s steps(1) infinite
  }

  @keyframes bl {
    50% {
      opacity: .25
    }
  }

  .credit {
    position: fixed;
    right: 16px;
    bottom: calc(52px + env(safe-area-inset-bottom, 0px));
    font-size: 7px;
    opacity: .75;
    text-shadow: 1px 1px 0 var(--shadow)
  }

  @media (prefers-reduced-motion:reduce) {
    .msg {
      animation: none
    }
  }
</style>

<canvas id="c" aria-label="16-bit landscape that changes with time of day and remaining usage"></canvas>
<div class="hud">
  <div>USAGE LEFT <b id="pct"></b><span class="hp" id="hp"></span></div>
  <div>RESET IN <b id="cd"></b></div>
  <div>SESSIONS TODAY <b id="ses"></b></div>
  <div>WEATHER <b id="wx"></b></div>
  <div><b id="tag"></b></div>
</div>
<div class="msg" id="msg" hidden>STORM WARNING<br>WINDOW ALMOST EMPTY</div>
<div class="credit">Art: Sunny Land by ansimuz (CC0)</div>
<div class="ctl">
  <span>DEMO ▸</span>
  <button id="live" aria-pressed="false" disabled>LIVE</button>
  <span id="times"></span>
  <label for="u">USAGE LEFT <input id="u" type="range" min="0" max="100" step="0.1" value="72"></label>
</div>
